<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project management — KPI Copilot Command Center</title>
  <link rel="stylesheet" href="assets/tokens.css" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header id="topbar" class="topbar"></header>
  <nav id="tabnav" class="tabnav"></nav>

  <main class="page">
    <div class="sample-banner">SAMPLE DATA — switch to Real; releases and due dates below are the project's actual plan either way, this banner only affects illustrative extras.</div>

    <div class="page-header">
      <h1>Project management</h1>
      <p>Releases on a timeline, and every task under them. Tasks are clickable.</p>
    </div>

    <div class="card">
      <h2 class="card__title">Release timeline</h2>
      <div id="gantt" class="gantt"></div>
      <div id="gantt-legend" class="gantt-legend"></div>
    </div>

    <div class="card">
      <h2 class="card__title">All tasks</h2>
      <div class="table-wrap">
        <table class="table">
          <thead><tr><th>Story</th><th>Release</th><th>Owner</th><th>Due</th></tr></thead>
          <tbody id="tasks-body"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="assets/common.js"></script>
  <script src="assets/pm.js"></script>
</body>
</html>
